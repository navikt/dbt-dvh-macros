[pytest]
filterwarnings =
    ignore::DeprecationWarning

markers =
    property: property based tests driven by hypothesis. Every example is a full dbt run, so
        these are slow and are deselected by default.

# a -m on the command line replaces this one, so "pytest -m property" runs exactly the
# property based tests and a bare "pytest" runs everything else
addopts = -m "not property"
