models:
  - name: dim_testdata
    config:
      materialized: scd
      scd_type: "{{ env_var('SCD_TYPE') | int }}"
      scd_key: "{{ env_var('SCD_KEY', '').split(',') | reject('equalto', '') | list }}"
      scd_hash: "{{ env_var('SCD_HASH', '').split(',') | reject('equalto', '') | list }}"
      filter_mode: "{{ env_var('FILTER_MODE') }}"
      schema_changes_enabled: "{{ env_var('SCHEMA_CHANGES', '').split(',') | reject('equalto', '') | list }}"

sources:
  - name: dbtuser
    tables:
      - name: testdata